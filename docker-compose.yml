# Homl Learn. Start with:   docker compose up -d
# Optional local engines:   docker compose --profile local-llm --profile local-voice --profile local-stt up -d
# (combine any profiles; see README.md)

services:
  app:
    build: .
    ports:
      - "${HOML_PORT:-8000}:8000"
    environment:
      # Set APP_PASSWORD to manage the password from here; otherwise set it on first visit.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Encrypts stored API keys. Generated into /data on first run if empty.
      SECRET_KEY: ${SECRET_KEY:-}
      # Set to true when served over HTTPS (behind a reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Keep calls to the bundled services off any host-wide HTTP proxy.
      NO_PROXY: renderer,ollama,kokoro,stt,searxng,localhost,127.0.0.1
      no_proxy: renderer,ollama,kokoro,stt,searxng,localhost,127.0.0.1
    volumes:
      - homl-data:/data
    networks: [default, render]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  renderer:
    build: ./renderer
    environment:
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-}
      # "angle" or "egl" can use the GPU when the container has one; default is software rendering.
      REMOTION_GL: ${REMOTION_GL:-}
    volumes:
      - homl-data:/data
    networks: [render]   # internal only: LLM-written scene code runs here
    restart: unless-stopped

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:0.40.4
    environment:
      # Ollama's default context is small; long sources would be cut off silently.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    restart: unless-stopped

  kokoro:
    profiles: [local-voice]
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    restart: unless-stopped

  stt:
    profiles: [local-stt]
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda
    environment:
      PRELOAD_MODELS: '["Systran/faster-whisper-large-v3"]'
    volumes:
      - hf-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    restart: unless-stopped

  searxng:
    profiles: [search]
    image: searxng/searxng:2026.9.30-a9d990033
    volumes:
      - ./deploy/searxng:/etc/searxng
    restart: unless-stopped

networks:
  render:
    internal: true

volumes:
  homl-data:
  ollama:
  hf-cache:
