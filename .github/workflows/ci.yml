name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - run: pip install -e '.[dev]'
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  renderer:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: renderer } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: renderer/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Renders every kit scene plus a valid and a broken custom scene.
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/render-test
          RENDER_CONCURRENCY: "2"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t homl-learn-app .
      - run: docker build -t homl-learn-renderer ./renderer
      - run: docker compose config -q
