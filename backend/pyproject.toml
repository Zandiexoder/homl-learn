[project]
name = "homl-learn"
version = "0.1.0"
description = "Self-hosted NotebookLM-style research notebook"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=0.69",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "numpy>=1.26",
  "pypdf>=5.0",
  "trafilatura>=1.12",
  "youtube-transcript-api>=1.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
